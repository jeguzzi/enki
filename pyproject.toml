[build-system]
requires = ["scikit-build-core>=0.11", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "pyenki"
version = "0.2.1"
dependencies = [
  "numpy>=1.21",
  'typing-extensions; python_version<"3.11"'
]

[project.optional-dependencies]
all = [
  "moviepy>=2",
  "jupyter_rfb",
  "thymio-behaviors>=0.0.2"
]
viewer = [
  "PySide6",
  "PyOpenGL"
]
behaviors = [
  "thymio-behaviors>=0.0.2"
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.define = {BUILD_TESTS = "OFF", BUILD_EXAMPLES = "OFF"}
install.components = ["pyenki"]
wheel.exclude = ["__pycache__"]